name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a pull request, check the PR's own commits, not GitHub's synthetic merge commit, which carries the
          # PR opener's GitHub identity rather than the commits' author.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No personal data or credentials in tracked files or commit metadata
        run: python3 pipeline/check_pii.py --commits
      - name: Catalog matches the data
        run: |
          python3 pipeline/seeds_no_evidence.py
          python3 pipeline/render_lists.py
          git status --short
          test -z "$(git status --porcelain)"
