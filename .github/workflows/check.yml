name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a pull request, check the PR's own commits, not GitHub's synthetic merge commit, which carries the
          # PR opener's GitHub identity rather than the commits' author.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the catalog tool
        run: |
          cmake -S . -B build
          cmake --build build --parallel
      - name: No personal data or credentials in tracked files or commit metadata
        run: build/fastpp check-pii --commits
      - name: Catalog matches the data
        run: |
          build/fastpp seeds
          build/fastpp render
          git status --short
          test -z "$(git status --porcelain)"
