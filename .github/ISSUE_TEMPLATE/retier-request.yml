name: Retier request
description: Evidence that an entry belongs in a higher or lower tier.
title: "Retier: "
labels: ["retier"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry page
      placeholder: catalog/stdlib-replacements/hash-maps-sets/owner-repo.md
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Proposed tier
      options:
        - "A: public benchmark code with compiler, flags and CPU stated"
        - "B: independent or peer-reviewed measurement"
        - "C: first-party claim"
        - "D: directional, no numbers"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links and quotes. For a downgrade, describe the harness flaw and where it is in the code.
    validations:
      required: true
