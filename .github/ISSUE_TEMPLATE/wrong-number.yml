name: Wrong number or fact
description: A quote, ratio, license, link or status that does not match its source.
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry page
      placeholder: catalog/stdlib-replacements/hash-maps-sets/owner-repo.md
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Quote the text from the entry.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What the source says
      description: Quote the source and link it.
    validations:
      required: true
