name: New entry
description: Propose a library or tool with a published comparison against a common default.
title: "New entry: "
labels: ["new entry"]
body:
  - type: markdown
    attributes:
      value: |
        An entry needs a numeric comparison against a baseline developers use by default for the same task, on a page anyone can open. See CONTRIBUTING.md for the evidence tiers.
  - type: input
    id: repo
    attributes:
      label: Repository or paper URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Baseline it beats
      description: The default it is compared against, for example std::unordered_map, zlib, OpenSSL, malloc.
    validations:
      required: true
  - type: input
    id: benchmark
    attributes:
      label: Benchmark URL
      description: The page with the numbers. Link the harness too if it is public.
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Published numbers
      description: Quote the comparison, with the workload and metric.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Hardware, compiler and flags
      description: As stated on the benchmark page, or "not stated".
  - type: input
    id: category
    attributes:
      label: Suggested category
      description: A category from catalog/README.md, or a new one.
  - type: textarea
    id: notes
    attributes:
      label: Anything a verifier should know
      description: Who ran the benchmark, known caveats, license.
